
[project]
name = "pyfxp"
dynamic = ["version"]
description = "Python fixed-point library."
readme = "README.md"
authors = [
    {name = "Eric Macedo", email = "ericsmacedo@gmail.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10.0,<4.0"
dependencies = [
    "numba>=0.62.1",
    "numpy>=2.2.6",
]
keywords = [
    "fixed-point",
    "fixed point",
    "q-format",
    "quantization",
    "rounding",
    "saturation",
    "bit-true",
    "dsp",
    "signal-processing",
    "fpga",
    "asic",
    "hdl",
    "rtl",
    "embedded",
    "numba",
    "numpy",
]

[project.urls]
"Homepage" = "https://github.com/ericsmacedo/pyfxp"
"Documentation" = "https://pyfxp.readthedocs.io/en/stable/"
"Bug Tracker" = "https://github.com/ericsmacedo/pyfxp/issues"

[dependency-groups]
bench = [
    "apytypes>=0.5.1",
    "fixedpoint>=1.0.1",
    "fxpmath>=0.4.10",
    "numfi>=0.5.0",
    "spfpm>=1.8.0",
]
dev = [
    "contextlib-chdir>=1.0.2",
    "coveralls>=3.3.1",
    "furo>=2025.12.19",
    "hypothesis>=6.168.5",
    "invoke>=2.2.0",
    "matplotlib>=3.10.7",
    "myst-parser>=4.0.1",
    "pre-commit>=4.1.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.11.2",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-design>=0.6.1",
    "truststore>=0.10.4",
    "ty>=0.0.1a24",
]

[project.scripts]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
includes = ["src/pyfxp"]

[tool.pdm.version]
source = "scm"
fallback_version = "0.0.0"

[tool.ruff]
line-length = 120
fix = true
target-version = "py310"

[tool.ruff.lint]
select = []
ignore = []
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # Magic Values
    "PLR2004",
    # Argument
    "ARG001",
    # Assert
    "S101",
    # Open is allowed
    "PTH123",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts ="""
    --cov src/pyfxp
    --cov-report term
    --cov-report html
    --doctest-glob=docs/*
    --doctest-modules
    --ignore-glob=tests/testdata/*
    --log-level=INFO
    --junitxml=report.xml
"""
filterwarnings = [
    "error",
]
testpaths = ["tests", "src"]  # Directories to search for tests (src: docstring examples)

[tool.coverage.run]
source = ["src/pyfxp"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    'return NotImplemented',
    'raise NotImplementedError()',
    'pragma: no cover',
    'assert False',
]


[tool.ty.rules]
